<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tunggakan SPP - Admin RQM</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">Dashboard</a>
                <a href="santri.html" class="nav-item">Data Santri</a>
                <a href="pembayaran.html" class="nav-item">Input Pembayaran</a>
                <a href="tunggakan.html" class="nav-item active">Tunggakan SPP</a>
                <a href="keuangan.html" class="nav-item">Pemasukan & Pengeluaran</a>
                <a href="laporan.html" class="nav-item">Laporan & Cetak</a>
                <a href="data_admin.html" class="nav-item">Data Admin</a>
            </nav>
            <div class="sidebar-footer"><a href="../index.html" class="nav-item text-danger">Keluar</a></div>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <h1 class="page-title">Laporan Tunggakan SPP</h1>
                <div class="user-info">Selamat bekerja, <strong>Admin</strong></div>
            </header>

            <div class="content-wrapper" style="padding: 20px;">
                <div style="background: #fff; padding: 20px; border-top: 4px solid #c00000; border-radius: 2px; border: 1px solid #d2d2d2;">
                    <div style="display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end;">
                        <div>
                            <label>Lokasi</label>
                            <select id="filterLokasiTunggakan" class="form-control">
                                <option value="Semua">Semua Lokasi</option>
                                <option value="RQM 1">RQM 1</option>
                                <option value="RQM 2">RQM 2</option>
                            </select>
                        </div>
                        <div>
                            <label>Tahun Ajaran</label>
                            <select id="filterTahunTunggakan" class="form-control">
                                <option value="2025/2026">2025/2026</option>
                                <option value="2026/2027">2026/2027</option>
                            </select>
                        </div>
                        <div>
                            <label>Bulan (Yang Belum Dibayar)</label>
                            <select id="filterBulanTunggakan" class="form-control">
                                <option value="Juli">Juli</option>
                                <option value="Agustus">Agustus</option>
                                <option value="September">September</option>
                            </select>
                        </div>
                        <button id="btnCekTunggakan" class="btn-primary" style="background-color: #c00000;">Cek Tunggakan</button>
                    </div>

                    <table style="width: 100%;">
                        <thead>
                            <tr>
                                <th>No. Reg</th>
                                <th>Nama Santri</th>
                                <th>Lokasi</th>
                                <th>SPP Tertunggak</th>
                                <th>Aksi (WhatsApp)</th>
                            </tr>
                        </thead>
                        <tbody id="tabelTunggakan">
                            <tr><td colspan="5" style="text-align: center;">Pilih filter dan klik Cek Tunggakan.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
